<!doctype html>
<html lang="zh-Hant" class="crystal-cursor">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winding XO — Authentication</title>
<link rel="stylesheet" href="assets/css/interaction.css?v=crystal2">
<script src="assets/js/browser-api.js"></script>
<script src="assets/js/runtime.js"></script>
<script defer src="assets/js/activity.js"></script>
<script defer src="assets/cursors/crystal-frames.js"></script>
<script defer src="assets/js/cursor.js?v=2"></script>
<script src="assets/js/config.js"></script>
<style>
:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:#c7f8ff}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden;
background:radial-gradient(ellipse at 50% 51%,#06384b 0%,#041727 35%,#00040a 70%,#000 100%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.27;
background:repeating-linear-gradient(180deg,transparent 0,transparent 3px,#62dfff0b 4px,#62dfff0b 5px)}
body::after{content:"";position:fixed;width:130vw;height:1px;top:24%;left:-15vw;transform:rotate(-17deg);pointer-events:none;
background:linear-gradient(90deg,transparent,#00cfff55,#c4ffff99,#00cfff22,transparent);box-shadow:0 0 18px #21d9ff88}
.shell{position:relative;width:min(92vw,490px);padding:clamp(23px,5vw,44px);border:1px solid #56e9ff77;
border-radius:4px;background:linear-gradient(140deg,#13475aab,#06202aeb 38%,#021018f5 100%);
box-shadow:inset 0 1px 0 #d4ffff55,0 0 14px #16cfff44,0 0 70px #058acb44;isolation:isolate}
.shell:before{content:"";position:absolute;inset:-5px;z-index:-1;pointer-events:none;
background:linear-gradient(110deg,transparent 13%,#5cf7ff24 35%,#c6ffff1a 48%,transparent 65%);clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.corner{position:absolute;width:19px;height:19px;border-color:#91f7ff;pointer-events:none}
.tl{top:-2px;left:-2px;border-left:3px solid;border-top:3px solid}.br{bottom:-2px;right:-2px;border-right:3px solid;border-bottom:3px solid}
.kicker{font-size:10px;letter-spacing:.42em;color:#56cde7;text-transform:uppercase;margin:0 0 11px}
h1{font-size:22px;font-weight:400;letter-spacing:.14em;margin:0 0 4px;text-shadow:0 0 15px #4ff6ff6b}
.rule{height:1px;margin:18px 0 25px;background:linear-gradient(90deg,#33d3fa,transparent)}
label{display:block;font-size:12px;font-weight:bold;letter-spacing:.17em;margin-bottom:10px;color:#bbfaff}
.field{position:relative;height:48px;border:1px solid #5ad8f2;background:#03101e;border-radius:2px;
box-shadow:inset 0 0 15px #0785ba44,0 0 10px #1bf3ff24}
.field:focus-within{border-color:#b4ffff;box-shadow:inset 0 0 15px #0785ba55,0 0 18px #1bf3ff77}
.field input{position:absolute;inset:0;width:100%;height:100%;padding:0 15px;border:0;background:transparent;
color:transparent;caret-color:transparent;font-size:21px;outline:0;z-index:2}
.mask{position:absolute;inset:0;padding:0 15px;overflow:hidden;white-space:nowrap;pointer-events:none;font-size:21px;
letter-spacing:2px;color:#ddfcff;text-shadow:0 0 8px #82efff;display:flex;align-items:center}
.mask .masked-text{white-space:pre;flex:none}
.mask .visual-caret{display:none;height:25px;width:1px;margin-left:0;background:#bfffff;box-shadow:0 0 6px #83f6ff;flex:none;animation:caret-blink 1s steps(1,end) infinite}
.field:focus-within .mask .visual-caret{display:inline-block}
@keyframes caret-blink{50%{opacity:0}}
.footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:17px}
.status{font-size:11px;letter-spacing:.05em;color:#74c0ce}
button{cursor:pointer;min-width:98px;padding:10px 19px;color:#d8fcff;border:1px solid #64dff4;
background:linear-gradient(#116e91,#07334f);font-weight:bold;letter-spacing:.15em;box-shadow:0 0 12px #2edfff55}
button:hover,button:focus-visible{filter:brightness(1.2);box-shadow:0 0 21px #5af5ff88}
button:disabled{cursor:not-allowed;opacity:.4;filter:none}
.hint{margin-top:23px;font-size:11px;color:#6095aa;line-height:1.6}
.power{position:fixed;right:22px;bottom:22px;display:grid;place-items:center;width:44px;min-width:44px;height:44px;padding:10px;border-radius:50%;background:#06202aeb}.power svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
</style>
</head>
<body>
<main class="shell">
<span class="corner tl"></span><span class="corner br"></span>
<p class="kicker">Macrosoft Winding XO</p>
<h1>ACCESS TERMINAL</h1>
<div class="rule"></div>
<form id="loginForm" autocomplete="off">
<label for="password">PASSWORD</label>
<div class="field">
<input id="password" name="password" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="PASSWORD" maxlength="128" autofocus>
<div id="mask" class="mask" aria-hidden="true"><span id="maskedBefore" class="masked-text"></span><span id="visualCaret" class="visual-caret"></span><span id="maskedAfter" class="masked-text"></span></div>
</div>
<div class="footer"><div class="status" id="status" aria-live="polite">ENTER PASSWORD</div><button id="enter" type="submit" disabled>ENTER</button></div>
</form>
<div class="hint">ANGEL SYSTEM · LOCAL AUTHENTICATION</div>
</main>
<button id="power" class="power" type="button" aria-label="關閉 App" title="關閉 App"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M6.3 5.8a8 8 0 1 0 11.4 0"/></svg></button>
<script>
// 使用一般文字輸入框保存實際輸入，另外用全形星號呈現遮罩。
// 僅在本頁比對 config 中的演出用密碼，不儲存或傳送輸入內容。
const input = document.getElementById('password');
const mask = document.getElementById('mask');
const maskedBefore = document.getElementById('maskedBefore');
const maskedAfter = document.getElementById('maskedAfter');
const visualCaret = document.getElementById('visualCaret');
const button = document.getElementById('enter');
const statusText = document.getElementById('status');
document.getElementById('power').onclick = async event => {
    const power = event.currentTarget;
    power.disabled = true;
    try {
        const host = window.getWindingAPI();
        if (!host) throw new Error('UNAVAILABLE');
        const result = await host.close_app();
        if (!result.ok) throw new Error(result.error);
    } catch (error) { statusText.textContent = error.message; }
    finally { power.disabled = false; }
};
function refresh() {
    const length = Array.from(input.value).length;
    // 自訂游標與全形星號採用同一組字體排版，避免原生游標依實際密碼字元寬度定位。
    const cursor = Math.min(length, Array.from(input.value.slice(0, input.selectionStart ?? input.value.length)).length);
    maskedBefore.textContent = '＊'.repeat(cursor);
    maskedAfter.textContent = '＊'.repeat(length - cursor);
    // 長密碼時保持游標可見。
    requestAnimationFrame(() => {
        const areaWidth = mask.clientWidth - 30;
        const caretX = maskedBefore.offsetWidth;
        const existing = Number(mask.dataset.scrollX || 0);
        const shifted = Math.max(0, caretX - Math.max(0, areaWidth - 4));
        const scrollX = caretX < existing ? caretX : Math.max(existing, shifted);
        maskedBefore.style.transform = '';
        mask.scrollLeft = scrollX;
    });
    button.disabled = length === 0;
    statusText.textContent = length ? 'ACCESS READY' : 'ENTER PASSWORD';
}
input.addEventListener('input', refresh);
input.addEventListener('click', refresh);
input.addEventListener('keyup', event => { if (event.key !== 'Enter') refresh(); });
input.addEventListener('select', refresh);
document.getElementById('loginForm').addEventListener('submit', event => {
    event.preventDefault();
    if (input.value !== window.WINDING_CONFIG.password) {
        statusText.textContent = 'ACCESS DENIED';
        return;
    }
    // 和開機畫面一樣，切換到同一個資料夾的另一份 HTML。
    location.assign(new URL('./desktop.html', location.href).href);
});
// 為方便展示，按 F 鍵可再次請求全螢幕；載入時自動請求通常受限制。
document.addEventListener('keydown', event => {
    if (!window.windingNative && event.key.toLowerCase() === 'f' && event.target !== input && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
    }
});
refresh();
</script>
</body>
</html>
